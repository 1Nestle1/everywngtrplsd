<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Прототип: игра про программирование</title>
  </head>
  <body>
    <h1>Прототип производительности</h1>
    <p><a href="./3d.html" style="color: #4ad9ff">Открыть 3D‑версию</a> · <a href="./" style="color: #4ad9ff">Игра</a></p>
    <main>
      <canvas id="field"></canvas>
      <section>
        <label>Действий в секунду на дрона
          <input id="speed" type="number" min="1" max="1000" value="5" />
        </label>
        <label>Количество дронов
          <input id="drones" type="number" min="1" max="20000" value="1" />
        </label>
        <pre id="stats"></pre>
        <button id="bench">Запустить бенчмарк VM</button>
        <pre id="benchOut"></pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
