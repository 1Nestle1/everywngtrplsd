<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Colonist Was Replaced</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="overlay"></div>

    <header id="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">The Colonist <em>Was Replaced</em></span>
      </div>
      <div id="inventory"></div>
      <div class="top-right">
        <span class="speed-label">Скорость <b id="speed">×1</b></span>
        <button id="menu-btn" class="icon-btn" title="Меню" aria-label="Меню"></button>
        <div id="menu" hidden>
          <button id="sandbox-btn">Песочница: изучить всё</button>
          <button id="reset-btn" class="danger">Сбросить прогресс</button>
          <a href="./3d.html">Тест производительности 3D</a>
        </div>
      </div>
    </header>

    <div id="windows"></div>

    <footer id="bottombar">
      <div class="guide">
        <div id="coach" role="status" hidden></div>
        <div id="goal" aria-label="Текущая цель"></div>
      </div>
      <nav id="dock" aria-label="Окна"></nav>
    </footer>

    <div id="toasts" aria-live="polite"></div>

    <div id="victory" hidden>
      <div class="victory-card">
        <h2>Маяк колонии запущен.<br />Колонисты летят.</h2>
        <p>Вас заменили не зря: вы автоматизировали астероид от горстки мха до золота из лабиринта — только кодом.</p>
        <button id="victory-close" class="run-btn">Продолжить игру</button>
      </div>
    </div>

    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
